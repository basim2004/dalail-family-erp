<div style="width:390px;height:844px;box-sizing:border-box;background:#EEF4FC;display:flex;flex-direction:column;overflow:hidden">
  <div class="pat" style="background-color:#164A9B;background-image:linear-gradient(160deg,#0C2F66,#2876C8);color:#fff;padding:20px 20px 36px;border-radius:0 0 32px 32px;position:relative">
    <div style="display:flex;align-items:center;gap:12px">
      <img src="81b15694-7665-4dfa-832d-18e4ecf8672c" alt="Logo" style="width:44px;height:44px">
      <div style="flex:1;font-size:11px;letter-spacing:.16em;font-weight:600;color:#F7D9A0">KAKKIDIPPURAM CAMPUS</div>
      <a href="AdPhMembers.dc.html" aria-label="Add member" style="display:flex;width:44px;height:44px;align-items:center;justify-content:center;border-radius:14px;background:#E99A24;color:#fff;text-decoration:none;font-size:26px;font-weight:600">+</a>
    </div>
    <div style="font-family:'Playfair Display',serif;font-size:32px;font-weight:700;margin-top:18px">Members</div>
    <div style="font-size:13px;color:#D6E4F8;margin-top:2px">7 receivers · ID cards ready</div>
  </div>
  <div style="padding:0 20px;margin-top:-20px"><input type="text" aria-label="Search members" placeholder="Search by name" style="width:100%;height:48px;border:0;border-radius:16px;background:#fff;padding:0 18px;font:500 15px Inter,sans-serif;box-sizing:border-box;box-shadow:0 8px 20px rgba(12,47,102,0.14)"></div>
  <div style="flex:1;overflow:hidden;padding:14px 20px 8px;display:flex;flex-direction:column;gap:10px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <div style="display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;box-shadow:0 4px 14px rgba(12,47,102,0.08);padding:8px 12px 8px 8px;border-left:4px solid #E99A24">
        <img src="{{r.img}}" alt="{{r.alt}}" style="width:44px;height:64px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid #DCE6F2">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px">{{r.name}}</div>
          <div style="font-size:12px;color:#5B6B82;margin-top:2px">{{r.place}} · {{r.pin}}</div>
          <span style="display:inline-block;margin-top:5px;background:#FFF1D6;color:#9A5B00;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em">RECEIVER</span>
        </div>
        <a href="AdPhMembers.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;border-radius:12px;background:#EAF3FF;font-size:12px;font-weight:700;text-decoration:none;color:#164A9B">ID PDF</a>
      </div>
    </sc-for>
  </div>
  <div style="margin:0 16px 14px;display:flex;background:#0C2F66;border-radius:22px;padding:4px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="{{t.href}}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:18px;text-decoration:none;font-size:10px;font-weight:600;color:{{t.fg}};background:{{t.bg}}">
        <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.label}}
      </a>
    </sc-for>
  </div>
</div>
