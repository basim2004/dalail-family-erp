button{font-family:inherit}

<div style="width:390px;height:844px;box-sizing:border-box;background:#EEF4FC;display:flex;flex-direction:column;overflow:hidden">
  <div class="pat" style="background-color:#164A9B;background-image:linear-gradient(160deg,#0C2F66,#2876C8);color:#fff;padding:20px 20px 30px;border-radius:0 0 32px 32px">
    <div style="display:flex;align-items:center;gap:12px">
      <img src="9954bf54-5fe6-42b2-8242-40a81570ccfa" alt="Logo" style="width:44px;height:44px">
      <div style="flex:1;font-size:11px;letter-spacing:.16em;font-weight:600;color:#F7D9A0">VIEW OR DOWNLOAD</div>
    </div>
    <div style="font-family:'Playfair Display',serif;font-size:32px;font-weight:700;margin-top:16px">Brochures</div>
  </div>
  <div style="flex:1;overflow:hidden;padding:14px 20px 6px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;gap:8px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button sc-camel-on-click="{{t.pick}}" aria-pressed="{{t.pressed}}" style="flex:1;min-height:44px;border-radius:999px;border:1px solid {{t.border}};background:{{t.bg}};color:{{t.fg}};font-size:14px;font-weight:600;cursor:pointer">{{t.label}}</button>
      </sc-for>
    </div>
    <div style="background:#fff;border-radius:20px;box-shadow:0 4px 14px rgba(12,47,102,0.08);border-left:4px solid #E99A24;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center">
      <img src="{{img}}" alt="Brochure page" style="width:100%;border:1px solid #DCE6F2;border-radius:6px">
      <div style="align-self:stretch;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:#3B4B63">
        <button sc-camel-on-click="{{prev}}" aria-label="Previous page" style="min-height:44px;padding:0 16px;border:1px solid #C9D6E8;border-radius:12px;background:#fff;font-size:13px;cursor:pointer">Prev</button>
        {{pageText}}
        <button sc-camel-on-click="{{next}}" aria-label="Next page" style="min-height:44px;padding:0 16px;border:1px solid #C9D6E8;border-radius:12px;background:#fff;font-size:13px;cursor:pointer">Next</button>
      </div>
      <a href="AdPhBrochures.dc.html" style="align-self:stretch;display:flex;align-items:center;justify-content:center;height:48px;border-radius:14px;background:#E99A24;color:#0C2F66;font-weight:700;font-size:14px;text-decoration:none">Download PDF</a>
    </div>
    <div style="font-size:12px;color:#5B6B82">{{note}}</div>
  </div>
  <div style="margin:0 16px 14px;display:flex;background:#0C2F66;border-radius:22px;padding:4px">
    <sc-for list="{{tabbar}}" as="t" hint-placeholder-count="4">
      <a href="{{t.href}}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:18px;text-decoration:none;font-size:10px;font-weight:600;color:{{t.fg}};background:{{t.bg}}">
        <svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>{{t.label}}
      </a>
    </sc-for>
  </div>
</div>
